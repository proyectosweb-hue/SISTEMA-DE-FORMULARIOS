name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad:
    name: Calidad (formato, lint, tipos, pruebas, build y e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Formato
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Pruebas unitarias y de migraciones
        run: pnpm test

      - name: Build de producción (sin formulario técnico)
        run: pnpm build

      - name: Instalar Chromium para e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Pruebas e2e (celular y escritorio)
        run: pnpm e2e

      - name: Guardar informe de e2e si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-e2e
          path: |
            playwright-report/
            test-results/
          retention-days: 7
